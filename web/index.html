<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>绝区零调频记录导出工具</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="left">
        <button id="btn-game" class="btn btn-primary"></button>
        <button id="btn-url" class="btn"></button>
        <div class="dropdown" id="dd-export">
          <button class="btn" id="btn-export"></button>
          <div class="menu">
            <button data-cmd="excel" id="cmd-excel"></button>
            <button data-cmd="uigf" id="cmd-uigf"></button>
            <button data-cmd="import" class="divider" id="cmd-import"></button>
          </div>
        </div>
        <button id="btn-new" class="btn" title=""></button>
      </div>
      <div class="right">
        <select id="uid-select" class="select" style="display:none"></select>
        <a class="btn btn-icon" id="btn-github" href="https://github.com/ykonut/zzz-signal-search-export-mygo" target="_blank" rel="noreferrer" title="GitHub" aria-label="GitHub">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
        <button class="btn btn-icon" id="btn-setting" title="">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>

    <p id="hint" class="hint"></p>
    <main id="detail" class="grid"></main>

  </div>

  <!-- URL 输入 -->
  <div class="modal-mask" id="modal-url">
    <div class="modal">
      <div class="modal-head">
        <h2 id="url-title">手动输入 URL</h2>
        <button class="close" data-close="modal-url">×</button>
      </div>
      <div class="modal-body">
        <p class="desc" id="url-hint" style="margin-top:0"></p>
        <textarea id="url-input" class="url-input" spellcheck="false"></textarea>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close="modal-url" id="url-cancel"></button>
        <button class="btn btn-primary" id="url-ok"></button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="modal-mask" id="modal-setting">
    <div class="modal">
      <div class="modal-head">
        <h2 id="setting-title"></h2>
        <button class="close" data-close="modal-setting">×</button>
      </div>
      <div class="modal-body" id="setting-body"></div>
      <div class="modal-foot">
        <button class="btn btn-primary" data-close="modal-setting" id="setting-close"></button>
      </div>
    </div>
  </div>

  <!-- UIGF 导出选择 -->
  <div class="modal-mask" id="modal-uigf">
    <div class="modal">
      <div class="modal-head">
        <h2 id="uigf-title"></h2>
        <button class="close" data-close="modal-uigf">×</button>
      </div>
      <div class="modal-body" id="uigf-list"></div>
      <div class="modal-foot">
        <button class="btn" data-close="modal-uigf" id="uigf-cancel"></button>
        <button class="btn btn-primary" id="uigf-ok"></button>
      </div>
    </div>
  </div>

  <input type="file" id="file-import" accept=".json,application/json" style="display:none" />
  <div class="toast" id="toast"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
